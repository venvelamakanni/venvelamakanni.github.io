/* ---------- toast & confirm ---------- */
let tt,undoFn=null;
function toast(m,undo){const e=$('#toast');undoFn=undo||null;e.innerHTML=`<span>${esc(m)}</span>${undo?'<button data-act="undo">Undo</button>':''}`;e.hidden=false;clearTimeout(tt);tt=setTimeout(()=>{e.hidden=true;undoFn=null},undo?5000:2400)}
function armed(b,label){
  if(b.dataset.armed)return true;const o=b.textContent;b.dataset.armed='1';b.textContent=label;b.classList.add('armed');
  setTimeout(()=>{if(b.isConnected){delete b.dataset.armed;b.textContent=o;b.classList.remove('armed')}},3000);return false;
}
function copyText(text,msg){
  const out=$('#out');const fb=()=>{if(out){out.hidden=false;out.value=text;out.focus();out.select()}toast('Select all and copy the text shown')};
  try{navigator.clipboard.writeText(text).then(()=>toast(msg),fb)}catch(e){fb()}
}
function csv(){
  const q=s=>{s=String(s==null?'':s);return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s};
  const L=['date,type,amount,category,subcategory,account,to_account,payee,note,tags'];
  S.tx.slice().sort((a,b)=>a.date<b.date?-1:1).forEach(t=>L.push([t.date,{exp:'expense',inc:'income',xfer:'transfer'}[t.type],t.amt.toFixed(2),t.cat?cat(t.cat).name:'',t.sub,acc(t.acc).name,t.to?acc(t.to).name:'',t.payee,t.note,(t.tags||[]).join('; ')].map(q).join(',')));
  return L.join('\n');
}
function restore(text){
  let o;try{o=JSON.parse(text)}catch(e){return toast('That backup could not be read. Paste the full text.')}
  if(!o||!Array.isArray(o.tx)||!Array.isArray(o.cats))return toast('That text is not a Pocket Ledger backup.');
  S=upgrade(o);fc={};save();render();toast('Restored '+S.tx.length+' entries');
}

/* ---------- passcode ---------- */
let L=null,hiddenAt=0;
async function hash(s){s='pocket-ledger:'+s;try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}catch(e){let h=5381;for(const c of s)h=((h<<5)+h+c.charCodeAt(0))|0;return 'd'+h}}
function showLock(mode){L={mode,buf:'',first:'',msg:'',shake:false};$('#lock').hidden=false;drawLock()}
function drawLock(){
  const t={unlock:'Enter Passcode',set1:'Choose a Passcode',set2:'Confirm Passcode',off:'Enter Passcode',change:'Enter Current Passcode'}[L.mode];
  $('#lock').innerHTML=`<div class="lock-in"><div style="font-size:44px">🔒</div><div class="lock-t">${t}</div><div class="dots${L.shake?' shake':''}">${[0,1,2,3].map(i=>`<i class="${i<L.buf.length?'f':''}"></i>`).join('')}</div><div class="lock-msg">${esc(L.msg)}</div>
  <div class="pin">${[1,2,3,4,5,6,7,8,9].map(n=>`<button data-act="pin" data-k="${n}">${n}</button>`).join('')}<span></span><button data-act="pin" data-k="0">0</button><button class="pin-del" data-act="pin" data-k="del">Delete</button></div>
  ${L.mode==='unlock'?'<button class="tbtn" data-act="pin-forgot">Forgot passcode</button>':'<button class="tbtn" data-act="pin" data-k="cancel">Cancel</button>'}</div>`;
}
async function pin(k){
  if(!L)return;
  if(k==='cancel'){L=null;$('#lock').hidden=true;return}
  if(k==='del'){L.buf=L.buf.slice(0,-1);L.shake=false;drawLock();return}
  if(L.buf.length>=4)return;L.buf+=k;L.shake=false;drawLock();
  if(L.buf.length<4)return;
  const code=L.buf;await new Promise(r=>setTimeout(r,140));
  if(L.mode==='set1'){L.first=code;L.mode='set2';L.buf='';L.msg='';drawLock();return}
  if(L.mode==='set2'){if(code===L.first){S.lock.hash=await hash(code);save();L=null;$('#lock').hidden=true;render();toast('Passcode on')}else{L.mode='set1';L.buf='';L.msg='Passcodes did not match. Try again.';L.shake=true;drawLock()}return}
  if((await hash(code))!==S.lock.hash){L.buf='';L.msg='Wrong passcode';L.shake=true;drawLock();return}
  if(L.mode==='unlock'){L=null;$('#lock').hidden=true}
  else if(L.mode==='off'){S.lock.hash=null;save();L=null;$('#lock').hidden=true;render();toast('Passcode off')}
  else{L.mode='set1';L.buf='';L.msg='';drawLock()}
}
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){hiddenAt=Date.now();return}
  if(S.lock.hash&&!L&&hiddenAt&&Date.now()-hiddenAt>=(+S.lock.after||0)*60000)showLock('unlock');
});

/* ---------- swipe to delete ---------- */
let sw=null,noClick=0;
document.addEventListener('touchstart',e=>{
  const w=e.target.closest('.swipe');
  document.querySelectorAll('.swipe.open').forEach(o=>{if(o!==w)o.classList.remove('open')});
  if(!w||e.target.closest('.del'))return;
  sw={w,x:e.touches[0].clientX,y:e.touches[0].clientY,base:w.classList.contains('open')?-88:0,h:null,dx:0};
},{passive:true});
document.addEventListener('touchmove',e=>{
  if(!sw)return;const dx=e.touches[0].clientX-sw.x,dy=e.touches[0].clientY-sw.y;
  if(sw.h===null){if(Math.abs(dx)<8&&Math.abs(dy)<8)return;sw.h=Math.abs(dx)>Math.abs(dy);if(sw.h)sw.w.classList.add('drag')}
  if(!sw.h)return;sw.dx=dx;const x=Math.max(-130,Math.min(0,sw.base+dx));sw.w.querySelector('.row').style.transform=`translateX(${x}px)`;
},{passive:true});
document.addEventListener('touchend',()=>{
  if(!sw)return;
  if(sw.h){const x=sw.base+sw.dx;sw.w.classList.remove('drag');sw.w.querySelector('.row').style.transform='';sw.w.classList.toggle('open',x<-44);noClick=Date.now()}
  sw=null;
});

/* ---------- events ---------- */
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b)return;
  const a=b.dataset.act,id=b.dataset.id,v=b.dataset.v;
  if(a==='edit'){if(Date.now()-noClick<400)return;const w=b.closest('.swipe');if(w&&w.classList.contains('open')){w.classList.remove('open');return}}
  switch(a){
  case 'tab':view.tab=v;view.open=null;render();window.scrollTo(0,0);break;
  case 'prev':shift(-1);render();break;
  case 'next':shift(1);render();break;
  case 'now':view.anchor=today();view.calDay=null;render();break;
  case 'unit':view.unit=v;if(v!=='month'&&view.mode==='cal')view.mode='daily';render();break;
  case 'mode':view.mode=v;if(v==='cal')view.unit='month';render();break;
  case 'calday':view.calDay=v;render();break;
  case 'open-month':view.unit='month';view.anchor=v;render();break;
  case 'clear-filt':view.filt=null;render();break;
  case 'stat':view.stat=v;view.open=null;render();break;
  case 'stat-open':view.open=view.open===id?null:id;render();break;
  case 'filt-cat':view.filt={k:'cat',id};view.tab='tx';render();window.scrollTo(0,0);break;
  case 'add':newTx(view.tab==='stats'&&view.stat==='inc'?'inc':'exp');break;
  case 'xfer':newTx('xfer');break;
  case 'edit':editTx(id);break;
  case 'row-del':{const i=S.tx.findIndex(x=>x.id===id);if(i<0)return;const g=S.tx.splice(i,1)[0];save();render();toast('Deleted',()=>{S.tx.push(g);save();render()});break}
  case 'undo':if(undoFn){undoFn();undoFn=null}$('#toast').hidden=true;break;
  case 'clear-sample':
    S.tx=S.tx.filter(t=>!t.sample);S.tpl=S.tpl.filter(t=>!t.sample);S.rec=S.rec.filter(r=>!r.sample);
    S.accs.forEach(x=>{if(x.sample){x.open=0;delete x.bonus;x.drop=!['Cash','Checking','Credit card'].includes(x.name);delete x.sample}});S.accs=S.accs.filter(x=>{const k=!x.drop||S.tx.some(t=>t.acc===x.id||t.to===x.id);delete x.drop;return k});
    S.sample=false;rebuildLearn(S);save();render();toast('Sample entries cleared');break;

  case 'sheet-close':if(sh&&sh.ret){const r=sh.ret;sh=r;if(r.items.length<2)r.phase='input';drawSheet();break}closeSheet();break;
  case 'voice':openVoice('');break;
  case 'v-listen':if(sh.listening&&recog){try{recog.stop()}catch(x){}}else startListen();break;
  case 'v-go':runVoice();break;
  case 'v-ex':{const ta=$('#v-text');if(ta)ta.value=v;sh.text=v;runVoice();break}
  case 'v-paste':{const fail=()=>{sh.status='Paste was blocked. Long-press the box and tap Paste.';drawSheet();const t2=$('#v-text');if(t2)t2.focus()};
    try{navigator.clipboard.readText().then(x=>{x=(x||'').trim();if(!x){sh.status='The clipboard is empty. Run the Siri shortcut first.';drawSheet();return}const ta=$('#v-text');if(ta)ta.value=x;sh.text=x;runVoice()},fail)}catch(x){fail()}break}
  case 'v-back':sh.phase='input';sh.status='';sh.cmd=null;drawSheet();break;
  case 'v-item':openDraft(+b.dataset.i);break;
  case 'v-drop':sh.items.splice(+b.dataset.i,1);if(!sh.items.length)sh.phase='input';drawSheet();break;
  case 'v-saveall':{const pend=sh.items.filter(i=>!i.saved),ready=pend.filter(i=>!itemNeeds(i).length);if(!ready.length)return err('Tap the entries marked in red to finish them.');
    ready.forEach(i=>{commitItem(i);i.saved=true});save();render();const left=pend.length-ready.length;
    if(left){drawSheet();toast(`Saved ${ready.length}. ${left} still need${left===1?'s':''} details.`)}else{closeSheet();toast(`Saved ${ready.length} entr${ready.length===1?'y':'ies'}`)}break}
  case 'v-apply':{const i=+b.dataset.i,c=sh.cmd,t=S.tx.find(x=>x.id===c.ids[i]);if(!t)return;const old=Object.assign({},t);Object.assign(t,c.changes[i]);delete t.sample;learnFrom(t);save();closeSheet();render();toast('Updated',()=>{Object.keys(t).forEach(k=>delete t[k]);Object.assign(t,old);save();render()});break}
  case 'v-del':{if(!armed(b,'Tap again to delete'))return;const i=S.tx.findIndex(x=>x.id===id);if(i<0)return;const g=S.tx.splice(i,1)[0];save();closeSheet();render();toast('Deleted',()=>{S.tx.push(g);save();render()});break}
  case 'v-open':closeSheet();editTx(id);break;
  case 'learn-clear':if(!armed(b,'Tap again to forget'))return;S.learn={};save();render();toast('Learned merchants cleared');break;
  case 'kp-open':showKp();break;
  case 'kp':kp(b.dataset.k);break;
  case 'tx-type':capture();sh.type=v;if(v!=='xfer'){const c=S.cats.find(x=>x.id===sh.d.cat);if(!c||c.kind!==v){sh.d.cat=S.last['c_'+v]||firstCat(v);sh.d.sub=''}}drawSheet();break;
  case 'pick':capture();sh.pick=!sh.pick;hideKp();drawSheet();break;
  case 'pick-cat':capture();sh.d.cat=id;sh.d.sub='';if(!cat(id).subs.length)sh.pick=false;drawSheet();break;
  case 'pick-sub':capture();sh.d.sub=v;sh.pick=false;drawSheet();break;
  case 'pick-new':{const n=$('#pick-new');n.hidden=!n.hidden;if(!n.hidden)$('#f-newcat').focus();break}
  case 'pick-new-save':{const nm=$('#f-newcat').value.trim();if(!nm)return;capture();const c={id:uid(),name:nm,icon:nm.charAt(0).toUpperCase(),color:COLORS[S.cats.length%COLORS.length],kind:sh.type,budget:0,subs:[]};S.cats.push(c);sh.d.cat=c.id;sh.d.sub='';sh.pick=false;save();drawSheet();break}
  case 'tx-save':saveTx(false);break;
  case 'tx-more':saveTx(true);break;
  case 'tx-dup':capture();sh.id=null;sh.d.date=today();sh.d.repeat='none';saveTx(false);break;
  case 'tx-del':{if(!armed(b,'Tap again to delete'))return;const i=S.tx.findIndex(x=>x.id===sh.id),g=S.tx.splice(i,1)[0];save();closeSheet();render();toast('Deleted',()=>{S.tx.push(g);save();render()});break}
  case 'fav-use':{const f=S.tpl.find(x=>x.id===id);if(!f)return;const fd=f.data;Object.assign(sh.d,{amt:fd.amt?String(fd.amt).replace('-','−'):'',cat:fd.cat||sh.d.cat,sub:fd.sub||'',acc:S.accs.some(x=>x.id===fd.acc)?fd.acc:sh.d.acc,to:fd.to||'',payee:fd.payee||'',note:fd.note||'',tags:(fd.tags||[]).join(', ')});sh.kp=!fd.amt;drawSheet();break}
  case 'fav-save':{capture();const d=sh.d,amt=evalAmt(d.amt);if(sh.type!=='xfer'&&!d.cat)return err('Choose a category first.');
    const c=sh.type==='xfer'?null:cat(d.cat);const name=d.note.trim()||d.payee.trim()||d.sub||(c?c.name:'Transfer');
    S.tpl.push({id:uid(),name,data:{type:sh.type,amt:amt&&!isNaN(amt)?amt:0,cat:sh.type==='xfer'?null:d.cat,sub:d.sub,acc:d.acc,to:d.to||null,payee:d.payee.trim(),note:d.note.trim(),tags:d.tags.split(',').map(s=>s.trim()).filter(Boolean)}});save();toast('Added "'+name+'" to favorites');break}

  case 'acc-new':openAcc(null);break;
  case 'acc-edit':openAcc(id);break;
  case 'acc-save':{capture();if(!saveAcc())return;closeSheet();render();toast('Saved');break}
  case 'sign':{const i=$('#a-open');const v=i.value.trim();i.value=/^[-−]/.test(v)?v.slice(1):'-'+v;break}
  case 'bonus-earn':{capture();const a=saveAcc();if(!a)return;if(!a.bonus)return err('Enter a bonus value first.');
    let dep=sh.d.bdep||'__new';
    if(dep==='__new')dep=rewardsAcc(a).id;else if(dep==='__card')dep=a.id;
    const rc=S.cats.find(c=>c.kind==='inc'&&/card rewards/i.test(c.name))||S.cats.find(c=>c.kind==='inc');
    const tx={id:uid(),ts:Date.now(),type:'inc',amt:a.bonus.amt,date:today(),cat:rc.id,sub:rc.subs.includes('Sign-up bonus')?'Sign-up bonus':'',acc:dep,to:null,payee:a.name,note:'Sign-up bonus',tags:['bonus']};
    S.tx.push(tx);Object.assign(a.bonus,{done:true,doneOn:today(),tx:tx.id});save();closeSheet();render();toast(money(tx.amt)+' added to '+acc(dep).name);break}
  case 'bonus-clear':{if(!armed(b,'Tap again to remove'))return;const a=S.accs.find(x=>x.id===sh.id);delete a.bonus;save();openAcc(a.id);render();break}
  case 'bonus-new':{const a=S.accs.find(x=>x.id===sh.id);delete a.bonus;save();openAcc(a.id);break}
  case 'acc-show':closeSheet();view.filt={k:'acc',id};view.tab='tx';render();window.scrollTo(0,0);break;
  case 'acc-xfer':closeSheet();newTx('xfer',{acc:id,to:''});break;
  case 'acc-del':{const n=S.tx.filter(t=>t.acc===id||t.to===id).length;if(n)return err(`This account has ${n} transaction${n===1?'':'s'}. Delete or move ${n===1?'it':'them'} first.`);if(S.accs.length<2)return err('Keep at least one account.');
    if(!armed(b,'Tap again to delete'))return;S.accs=S.accs.filter(x=>x.id!==id);if(view.filt&&view.filt.id===id)view.filt=null;save();closeSheet();render();toast('Account deleted');break}

  case 'cat-new':openCat(null,v);break;
  case 'cat-edit':openCat(id);break;
  case 'cat-col':capture();sh.d.color=v;drawSheet();break;
  case 'sub-add':{const i=$('#c-sub'),s=i.value.trim();if(!s){i.focus();return}capture();if(!sh.d.subs.includes(s))sh.d.subs.push(s);drawSheet();$('#c-sub').focus();break}
  case 'sub-del':capture();sh.d.subs.splice(+b.dataset.i,1);drawSheet();break;
  case 'cat-save':{capture();const d=sh.d;if(!d.name.trim())return err('Give the category a name.');const bud=d.budget&&d.budget.trim()?evalAmt(d.budget):0;
    const o={name:d.name.trim(),icon:(d.icon||'').trim()||d.name.trim().charAt(0).toUpperCase(),color:d.color,subs:d.subs.slice(),budget:bud>0?bud:0};
    if(sh.id)Object.assign(S.cats.find(x=>x.id===sh.id),o);else S.cats.push(Object.assign({id:uid(),kind:d.ck},o));
    save();closeSheet();render();toast('Saved');break}
  case 'cat-del':{const c=cat(sh.id),others=S.cats.filter(x=>x.kind===c.kind&&x.id!==c.id);if(!others.length)return err('Keep at least one category of this type.');
    const target=others.find(x=>/^other/i.test(x.name))||others[0],n=S.tx.filter(t=>t.cat===c.id).length;
    if(!armed(b,n?`Move ${n} to ${target.name}?`:'Tap again to delete'))return;
    S.tx.forEach(t=>{if(t.cat===c.id){t.cat=target.id;t.sub=''}});S.rec.forEach(r=>{if(r.cat===c.id)r.cat=target.id});S.tpl.forEach(f=>{if(f.data.cat===c.id)f.data.cat=target.id});
    S.cats=S.cats.filter(x=>x.id!==c.id);if(view.filt&&view.filt.id===c.id)view.filt=null;save();closeSheet();render();toast(n?`Moved ${n} to ${target.name}`:'Category deleted');break}

  case 'fav-del':S.tpl=S.tpl.filter(f=>f.id!==id);save();render();break;
  case 'rec-stop':if(!armed(b,'Stop?'))return;S.rec=S.rec.filter(r=>r.id!==id);save();render();toast('Stopped. Past entries kept.');break;
  case 'copy-json':copyText(JSON.stringify(S),'Backup copied');break;
  case 'copy-csv':copyText(csv(),'CSV copied');break;
  case 'dl-csv':try{const u=URL.createObjectURL(new Blob([csv()],{type:'text/csv'})),l=document.createElement('a');l.href=u;l.download='pocket-ledger-'+today()+'.csv';document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);toast('If nothing downloaded, use Copy as CSV')}catch(x){toast('Use Copy as CSV here')}break;
  case 'restore':{const t=$('#restore-in').value.trim();if(!t){$('#restore-in').focus();return}if(!armed(b,'Tap again to replace all data'))return;restore(t);break}
  case 'erase':if(!armed(b,'Tap again to erase everything'))return;{const lock=S.lock;S=defaults();S.lock=lock;}view.filt=null;save();render();toast('All data erased');break;

  case 'pin-on':showLock('set1');break;
  case 'pin-off':showLock('off');break;
  case 'pin-change':showLock('change');break;
  case 'pin':pin(b.dataset.k);break;
  case 'pin-forgot':if(!armed(b,'Tap again to erase all data and remove the passcode'))return;S=defaults();save();L=null;$('#lock').hidden=true;render();toast('Data erased. Restore a backup in Settings.');break;
  }
});
document.addEventListener('input',e=>{
  if(e.target.id==='v-text'){if(sh)sh.text=e.target.value;return}
  if(e.target.id==='q'){view.q=e.target.value;const p=period(view.unit,view.anchor);let it=ptx(p);const f=view.filt;if(f)it=it.filter(t=>f.k==='acc'?(t.acc===f.id||t.to===f.id):t.cat===f.id);
    $('#list').innerHTML=view.q.trim()?searchHTML():view.mode==='cal'?calHTML(it):view.unit==='year'?yearHTML(it):listHTML(it);}
});
document.addEventListener('focusin',e=>{if(sh&&sh.kind==='tx'&&e.target.closest('#panel')&&/INPUT|SELECT/.test(e.target.tagName))hideKp()});
document.addEventListener('change',e=>{
  const el=e.target;
  if(el.dataset.bud){const val=el.value.trim()?evalAmt(el.value):0,n=val>0?val:0;if(el.dataset.bud==='total')S.budget=n;else cat(el.dataset.bud).budget=n;save();render()}
  else if(el.id==='s-cur'){S.currency=el.value;fc={};save();render();toast('Showing amounts in '+S.currency)}
  else if(el.id==='s-ms'){S.mstart=+el.value;save();render();toast(S.mstart===1?'Months follow the calendar':'Months now start on day '+S.mstart)}
  else if(el.id==='s-after'){S.lock.after=+el.value;save()}
  else if(el.id==='s-vacc'){S.voice.defAcc=el.value||null;save();toast(el.value?'Voice default: '+acc(el.value).name:'Voice uses your last account')}
  else if(el.id==='a-group'&&sh){capture();drawSheet()}
  else if(el.id==='restore-file'&&el.files[0]){const fr=new FileReader();fr.onload=()=>restore(String(fr.result));fr.readAsText(el.files[0])}
});
document.addEventListener('keydown',e=>{
  if(L&&/^[0-9]$/.test(e.key)){pin(e.key);return}
  if(L&&e.key==='Backspace'){pin('del');return}
  if(!sh)return;
  if(e.key==='Escape'){closeSheet();return}
  if(sh.kind==='voice'&&e.key==='Enter'&&!e.shiftKey&&document.activeElement&&document.activeElement.id==='v-text'){e.preventDefault();runVoice();return}
  const inField=/INPUT|SELECT|TEXTAREA/.test(document.activeElement&&document.activeElement.tagName);
  if(sh.kind==='tx'&&sh.kp&&!inField){
    const m={'*':'×','x':'×','/':'÷','-':'−','+':'+','.':'.',',':'.','Backspace':'⌫','Enter':'done','=':'done'};
    if(/^[0-9]$/.test(e.key)){kp(e.key);e.preventDefault()}else if(m[e.key]){kp(m[e.key]);e.preventDefault()}
    return;
  }
  if(e.key==='Enter'&&inField&&document.activeElement.tagName==='INPUT'){
    const id=document.activeElement.id;e.preventDefault();
    if(id==='f-newcat')$('[data-act="pick-new-save"]').click();else if(id==='c-sub')$('[data-act="sub-add"]').click();
    else if(sh.kind==='tx')saveTx(false);else if(sh.kind==='acc')$('[data-act="acc-save"]').click();else $('[data-act="cat-save"]').click();
  }
});
window.addEventListener('scroll',()=>{$('#navbar').classList.toggle('scrolled',window.scrollY>34)},{passive:true});


load();
if(runRec())save();
render();
if(S.lock.hash)showLock('unlock');
try{const q=new URLSearchParams(location.search).get('say');if(q){history.replaceState(null,'',location.pathname);openVoice(q)}}catch(e){}
})();
</script>
