<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Pocket Ledger</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ledger">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<style>
[hidden]{display:none!important}
img{max-width:100%}

/* Layout: iOS grouped-inset app. Sticky glass nav bar with large titles, floating glass tab bar + add button, bottom sheets with calculator keypad */
:root{
  --bg:#F2F2F7;--bg2:#FFFFFF;--bg3:#E9E9EE;--fill:rgba(120,120,128,.12);--fill2:rgba(120,120,128,.2);--thumb:#FFFFFF;
  --label:#000000;--label2:rgba(60,60,67,.6);--label3:rgba(60,60,67,.3);--sep:rgba(60,60,67,.2);
  --blue:#007AFF;--red:#FF3B30;--green:#248A3D;--orange:#C75F00;--meter-ok:#34C759;--meter-warn:#FF9500;
  --glass:rgba(250,250,252,.72);--glass-edge:rgba(255,255,255,.7);--shadow:0 8px 30px rgba(0,0,0,.12);
  --kbd:#D1D3D9;--key:#FFFFFF;--key2:#ADB2BC;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro",system-ui,"Helvetica Neue",Arial,sans-serif;
  --round:ui-rounded,"SF Pro Rounded",-apple-system,system-ui,sans-serif;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#000000;--bg2:#1C1C1E;--bg3:#2C2C2E;--fill:rgba(118,118,128,.24);--fill2:rgba(118,118,128,.36);--thumb:#636366;
  --label:#FFFFFF;--label2:rgba(235,235,245,.6);--label3:rgba(235,235,245,.3);--sep:rgba(84,84,88,.65);
  --blue:#0A84FF;--red:#FF453A;--green:#30D158;--orange:#FF9F0A;--meter-ok:#30D158;--meter-warn:#FF9F0A;
  --glass:rgba(36,36,40,.68);--glass-edge:rgba(255,255,255,.12);--shadow:0 8px 30px rgba(0,0,0,.55);
  --kbd:#1F1F21;--key:#4B4B4F;--key2:#2E2E31;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#000000;--bg2:#1C1C1E;--bg3:#2C2C2E;--fill:rgba(118,118,128,.24);--fill2:rgba(118,118,128,.36);--thumb:#636366;
  --label:#FFFFFF;--label2:rgba(235,235,245,.6);--label3:rgba(235,235,245,.3);--sep:rgba(84,84,88,.65);
  --blue:#0A84FF;--red:#FF453A;--green:#30D158;--orange:#FF9F0A;--meter-ok:#30D158;--meter-warn:#FF9F0A;
  --glass:rgba(36,36,40,.68);--glass-edge:rgba(255,255,255,.12);--shadow:0 8px 30px rgba(0,0,0,.55);
  --kbd:#1F1F21;--key:#4B4B4F;--key2:#2E2E31;color-scheme:dark}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--label);font:17px/1.3 var(--font);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
body.noscroll{overflow:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:16;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer;-webkit-user-select:none;user-select:none}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.num{font-variant-numeric:tabular-nums}

/* nav bar */
.navbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:15;transition:background .2s,box-shadow .2s}
.navbar.scrolled{background:var(--glass);-webkit-backdrop-filter:blur(20px) saturate(180%);backdrop-filter:blur(20px) saturate(180%);box-shadow:0 .5px 0 var(--sep)}
.nav-in{max-width:620px;margin:0 auto;height:44px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.nav-title{font-size:17px;font-weight:600;opacity:0;transition:opacity .2s;white-space:nowrap}
.navbar.scrolled .nav-title{opacity:1}
.nav-trail{justify-self:end;display:flex;gap:4px}
.tbtn{background:none;border:0;color:var(--blue);font-size:17px;padding:0 4px;min-height:44px;display:inline-flex;align-items:center;gap:4px}
.tbtn.b{font-weight:600}
.tbtn:disabled{color:var(--label3)}
.navicon{width:36px;height:36px;border-radius:50%;background:var(--fill);border:0;color:var(--blue);display:grid;place-items:center}

.app{max-width:620px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 calc(120px + env(safe-area-inset-bottom,0px))}
.large{font-size:34px;line-height:41px;font-weight:700;letter-spacing:.012em;margin:0 0 12px;text-wrap:balance}
.stack{display:flex;flex-direction:column;gap:12px}

/* grouped lists */
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:20px 16px 7px;font-size:13px;color:var(--label2);text-transform:uppercase;letter-spacing:.02em}
.sec-h:first-child{padding-top:4px}
.sec-h .num{text-transform:none;letter-spacing:0}
.sec-f{font-size:13px;line-height:1.35;color:var(--label2);padding:7px 16px 0;margin:0}
.group{background:var(--bg2);border-radius:22px;overflow:hidden}
.cell{position:relative;display:flex;align-items:center;gap:12px;min-height:46px;padding:10px 16px;width:100%;background:none;border:0;text-align:left;font-size:17px;color:var(--label)}
.group>.cell:not(:first-child)::before,.group>.frow:not(:first-child)::before,.group>.swipe:not(:first-child)>.row::before,.group>.picker::before{content:"";position:absolute;top:0;right:0;left:16px;height:.5px;background:var(--sep)}
.group>.cell.ic:not(:first-child)::before,.group>.swipe:not(:first-child)>.row::before{left:62px}
button.cell:active,.row:active{background:var(--fill)}
.cell .grow{flex:1;min-width:0}
.cell .val{margin-left:auto;color:var(--label2);text-align:right;white-space:nowrap}
.cell .sub{display:block;font-size:13px;color:var(--label2);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cell.link{color:var(--blue)}
.cell.red,.red{color:var(--red)}
.cell select,.cell input.binp{-webkit-appearance:none;appearance:none;border:0;background:none;color:var(--label2);text-align:right;text-align-last:right;font-size:17px;margin-left:auto;padding:0;min-width:0}
.chev{color:var(--label3);width:14px;height:14px;stroke-width:2.6}
.tile{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;font-size:17px;line-height:1;flex:none;background:var(--fill);background:color-mix(in srgb,var(--c) 22%,transparent)}
.tile.lg{width:38px;height:38px;border-radius:11px;font-size:20px}
.tile.sm{width:24px;height:24px;border-radius:7px;font-size:14px}
.tile.solid{background:var(--c);color:#fff;font-weight:700;font-size:15px}

/* segmented, period */
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--fill);border-radius:10px;padding:2px;gap:2px}
.seg button{height:30px;border:0;background:none;border-radius:8px;font-size:13px;font-weight:600}
.seg button.on{background:var(--thumb);box-shadow:0 2px 6px rgba(0,0,0,.12),0 0 0 .5px rgba(0,0,0,.04)}
.pbar{display:flex;align-items:center;justify-content:space-between;gap:6px}
.plabel{border:0;background:none;font-size:20px;font-weight:600;padding:6px 4px;text-align:center;flex:1;min-width:0}
.pbtn{width:40px;height:40px;border:0;background:var(--fill);border-radius:50%;color:var(--blue);display:grid;place-items:center;flex:none}

/* summary */
.sum3{display:grid;grid-template-columns:repeat(3,1fr);padding:12px 4px}
.sum3>div{padding:0 12px;min-width:0}
.sum3>div+div{border-left:.5px solid var(--sep)}
.sum3 span{display:block;font-size:12px;color:var(--label2)}
.sum3 b{display:block;font-size:17px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.inc{color:var(--green)}.exp{color:var(--red)}
.hero{padding:16px}
.hero span{font-size:13px;color:var(--label2)}
.hero b{display:block;font:700 34px/1.15 var(--round);font-variant-numeric:tabular-nums;letter-spacing:-.01em;margin-top:2px;overflow-wrap:anywhere}

/* search & pills */
.search{display:flex;align-items:center;gap:6px;background:var(--fill);border-radius:12px;height:38px;padding:0 10px;color:var(--label2)}
.search input{flex:1;min-width:0;border:0;background:none;outline:none;font-size:17px;color:var(--label)}
.search input::placeholder{color:var(--label2)}
.pill{display:inline-flex;align-items:center;gap:8px;align-self:flex-start;background:var(--blue);color:#fff;border-radius:99px;padding:6px 6px 6px 12px;font-size:14px;font-weight:600}
.pill button{width:22px;height:22px;border-radius:50%;border:0;background:rgba(255,255,255,.25);color:#fff;font-size:12px;display:grid;place-items:center}
.chip{height:32px;padding:0 12px;border-radius:99px;border:0;background:var(--fill);font-size:14px;font-weight:600;flex:none}
.chip.on{background:var(--blue);color:#fff}

/* transaction rows */
.day-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:18px 16px 7px;font-size:13px;font-weight:600;color:var(--label2);text-transform:uppercase;letter-spacing:.02em}
.day-h .num{text-transform:none;font-weight:400;letter-spacing:0}
.swipe{position:relative;overflow:hidden}
.swipe .del{position:absolute;top:0;right:0;bottom:0;width:88px;border:0;background:var(--red);color:#fff;font-size:15px;font-weight:600}
.row{position:relative;display:flex;align-items:center;gap:12px;width:100%;padding:10px 16px;border:0;background:var(--bg2);text-align:left;transition:transform .22s cubic-bezier(.2,.8,.2,1);touch-action:pan-y}
.swipe.drag .row{transition:none}
.swipe.open .row{transform:translateX(-88px)}
.row-m{flex:1;min-width:0}
.row-t{font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-s{font-size:13px;color:var(--label2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.row-a{font-size:17px;font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right}
.row-a small{display:block;font-size:12px;color:var(--label2)}
.row-a.xf{color:var(--label2)}
.tag{display:inline-block;font-size:11px;padding:0 6px;border-radius:5px;background:var(--fill);color:var(--label2);margin-left:4px}
.empty{background:var(--bg2);border-radius:22px;padding:34px 20px;text-align:center;color:var(--label2);font-size:15px}
.empty b{display:block;font-size:20px;color:var(--label);margin-bottom:4px}

/* calendar */
.calw,.cal{display:grid;grid-template-columns:repeat(7,1fr)}
.calw{padding:10px 6px 0}
.calw span{text-align:center;font-size:11px;font-weight:600;color:var(--label2)}
.cal{padding:4px 6px 8px;row-gap:2px}
.cd{border:0;background:none;border-radius:12px;padding:4px 0 6px;display:flex;flex-direction:column;align-items:center;gap:1px;min-height:58px;min-width:0}
.cd .n{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:17px;font-variant-numeric:tabular-nums}
.cd.today .n{color:var(--red);font-weight:600}
.cd.on .n{background:var(--label);color:var(--bg2);font-weight:600}
.cd.today.on .n{background:var(--red);color:#fff}
.cd i{font-style:normal;font-size:10px;line-height:1.15;font-variant-numeric:tabular-nums;max-width:100%;overflow:hidden;text-overflow:clip;white-space:nowrap}
.cd .ci{color:var(--green)}.cd .ce{color:var(--red)}

/* stats */
.donut{display:block;width:200px;max-width:64%;height:auto;margin:6px auto 4px}
.donut .d1{fill:var(--label2);font:13px var(--font)}
.donut .d2{fill:var(--label);font:600 22px var(--round)}
.pct{font-size:13px;color:var(--label2);font-variant-numeric:tabular-nums;min-width:38px;text-align:right}
.bar{height:6px;border-radius:3px;background:var(--fill);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;border-radius:3px}
.subrow{padding:8px 16px 8px 62px;display:block;width:100%;border:0;background:var(--bg);text-align:left}
.subrow .t{display:flex;justify-content:space-between;font-size:15px;gap:8px}
.subrow .t span:last-child{font-variant-numeric:tabular-nums}
.meter{position:relative;height:8px;border-radius:4px;background:var(--fill);overflow:visible;margin-top:8px}
.meter i{display:block;height:100%;border-radius:4px;background:var(--meter-ok)}
.meter.warn i{background:var(--meter-warn)}.meter.over i{background:var(--red)}
.meter b{position:absolute;top:-4px;bottom:-4px;width:2px;border-radius:1px;background:var(--label);opacity:.55}
.trend{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;align-items:end;padding:14px 16px}
.tc{display:flex;flex-direction:column;align-items:center;gap:5px;min-width:0}
.tv{font-size:11px;color:var(--label2);white-space:nowrap;font-variant-numeric:tabular-nums}
.tb{height:110px;width:100%;max-width:34px;display:flex;align-items:flex-end}
.tb i{display:block;width:100%;border-radius:7px;background:var(--blue);opacity:.35;min-height:3px}
.tc.on .tb i{opacity:1}
.tl{font-size:12px;color:var(--label2);white-space:nowrap}
.tc.on .tl{color:var(--label);font-weight:600}
.stats{display:grid;grid-template-columns:1fr 1fr}
.stats>div{padding:12px 16px;min-width:0}
.stats>div:nth-child(odd){border-right:.5px solid var(--sep)}
.stats>div:nth-child(n+3){border-top:.5px solid var(--sep)}
.stats span{display:block;font-size:13px;color:var(--label2)}
.stats b{display:block;font-size:20px;font-weight:600;font-variant-numeric:tabular-nums;margin-top:2px;overflow-wrap:anywhere}
.stats small{display:block;font-size:12px;color:var(--label2);overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.binp{width:110px;font-variant-numeric:tabular-nums}
.binp::placeholder{color:var(--label3)}

/* tab bar */
.tabwrap{position:fixed;left:0;right:0;bottom:0;z-index:20;pointer-events:none;padding:0 max(16px,env(safe-area-inset-right,0px)) max(12px,calc(env(safe-area-inset-bottom,0px) - 4px)) max(16px,env(safe-area-inset-left,0px))}
.tabin{max-width:620px;margin:0 auto;display:flex;gap:10px;align-items:center}
.tabbar{pointer-events:auto;flex:1;display:grid;grid-template-columns:repeat(4,1fr);height:62px;padding:4px;border-radius:31px;background:var(--glass);-webkit-backdrop-filter:blur(24px) saturate(180%);backdrop-filter:blur(24px) saturate(180%);box-shadow:var(--shadow),inset 0 0 0 .5px var(--glass-edge)}
.tab{border:0;background:none;border-radius:27px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:10px;font-weight:600;color:var(--label);min-width:0}
.tab svg{width:25px;height:25px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tab.on{color:var(--blue);background:var(--fill)}
.fab{pointer-events:auto;width:62px;height:62px;border-radius:50%;border:0;background:var(--blue);color:#fff;box-shadow:var(--shadow);display:grid;place-items:center;flex:none}
.fab svg{width:28px;height:28px;stroke:#fff;stroke-width:2.6;fill:none;stroke-linecap:round}

/* sheet */
.sheet{position:fixed;inset:0;z-index:40}
.scrim{position:absolute;inset:0;border:0;width:100%;background:rgba(0,0,0,.4);animation:fade .2s}
.panel{position:absolute;left:0;right:0;bottom:0;max-width:620px;margin:0 auto;height:calc(100% - env(safe-area-inset-top,0px) - 12px);background:var(--bg);border-radius:28px 28px 0 0;display:flex;flex-direction:column;overflow:hidden;box-shadow:var(--shadow);animation:up .3s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
@keyframes fade{from{opacity:0}}
@media (prefers-reduced-motion:reduce){.panel,.scrim{animation:none}.row{transition:none}}
.sscroll{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;padding:0 max(16px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:12px}
.sscroll>*{flex-shrink:0}
.sgn{flex:none;width:40px;height:32px;border-radius:8px;border:0;background:var(--fill);color:var(--blue);font-size:19px;font-weight:600}
.mic{pointer-events:auto;width:54px;height:54px;border-radius:50%;border:0;background:var(--glass);-webkit-backdrop-filter:blur(24px) saturate(180%);backdrop-filter:blur(24px) saturate(180%);box-shadow:var(--shadow),inset 0 0 0 .5px var(--glass-edge);color:var(--blue);display:grid;place-items:center;flex:none}
.mic svg,.vmic svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.vmic{position:relative;width:92px;height:92px;border-radius:50%;border:0;background:var(--blue);color:#fff;display:grid;place-items:center;margin:6px auto 0;box-shadow:var(--shadow)}
.vmic svg{width:40px;height:40px}
.vmic.on{background:var(--red)}
.vmic.on::after{content:"";position:absolute;inset:-8px;border-radius:50%;border:3px solid var(--red);animation:ring 1.2s ease-out infinite}
@keyframes ring{from{transform:scale(.92);opacity:.7}to{transform:scale(1.22);opacity:0}}
@media (prefers-reduced-motion:reduce){.vmic.on::after{animation:none}}
.vstat{text-align:center;font-size:15px;color:var(--label2);min-height:20px}
textarea.vtext{height:auto;min-height:92px;border-radius:16px;padding:12px 14px;font:17px/1.4 var(--font);resize:none;outline:none}
.vbtns{display:flex;gap:8px}
.vbtns .btn{flex:1;height:44px}
.btn.ghost{background:var(--fill);color:var(--blue)}
.heard{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;background:var(--bg2);border-radius:16px;padding:10px 12px 10px 16px;font-size:17px;line-height:1.35}
.heard .tbtn{min-height:24px;padding:0 4px;flex:none}
.heard.sm{font-size:15px;color:var(--label2);padding:10px 16px}
.vq{min-width:0;overflow-wrap:anywhere}
.vrow{gap:8px}
.vmain{flex:1;min-width:0;display:flex;align-items:center;gap:12px;background:none;border:0;padding:0;text-align:left;color:inherit;font:inherit}
.vmain:disabled{opacity:.6}
.ok{color:var(--green);font-weight:600}
.frow.miss>span:first-child{color:var(--red);font-weight:600}
.grabber{width:36px;height:5px;border-radius:3px;background:var(--fill2);margin:7px auto 0;flex:none}
.sheet-bar{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;min-height:44px}
.sheet-bar .tbtn:last-child{justify-self:end}
.sheet-bar .tbtn:first-child{justify-self:start}
.sheet-title{font-size:17px;font-weight:600;text-align:center}
.favs{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px}
.favs::-webkit-scrollbar{display:none}
.fav{flex:none;height:34px;border:0;border-radius:99px;background:var(--bg2);padding:0 14px;font-size:14px;font-weight:600;color:var(--label);display:flex;gap:6px;align-items:center}
.fav b{font-weight:500;color:var(--label2);font-variant-numeric:tabular-nums}
.amount{display:flex;align-items:baseline;justify-content:center;gap:4px;border:0;background:none;padding:10px 0 0;width:100%;font:600 52px/1.1 var(--round);font-variant-numeric:tabular-nums;color:var(--label);min-width:0;overflow:hidden}
.amount .cur{font-size:30px;color:var(--label2)}
.amount #amt-v{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:85%}
.amount.inc{color:var(--green)}.amount.xfer{color:var(--blue)}
.amount.typing #amt-v::after{content:"";display:inline-block;width:2px;height:.8em;margin-left:3px;background:var(--blue);vertical-align:-.05em;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.amt-x{text-align:center;font-size:15px;color:var(--label2);min-height:20px;margin-top:-8px;font-variant-numeric:tabular-nums}
.frow{position:relative;display:flex;align-items:center;gap:12px;min-height:48px;padding:6px 16px;width:100%;background:none;border:0;text-align:left;font-size:17px;color:var(--label)}
.frow>span:first-child{flex:none;min-width:84px}
.frow input,.frow select{flex:1;min-width:0;border:0;background:none;outline:none;font-size:17px;color:var(--label2);text-align:right;text-align-last:right;-webkit-appearance:none;appearance:none;padding:0;height:36px}
.frow input::placeholder{color:var(--label3)}
.frow input[type=date]{display:flex;justify-content:flex-end}
.frow input[type=date]::-webkit-date-and-time-value{text-align:right}
.fval{flex:1;min-width:0;display:flex;align-items:center;justify-content:flex-end;gap:8px;color:var(--label2);white-space:nowrap;overflow:hidden}
.ph{color:var(--label3)}
.picker{position:relative;padding:12px 10px}
.pgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.pt{border:0;background:none;border-radius:14px;padding:8px 2px;display:flex;flex-direction:column;align-items:center;gap:5px;font-size:12px;color:var(--label);min-width:0}
.pt span:last-child{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pt .tile{width:44px;height:44px;border-radius:13px;font-size:22px}
.pt.on{background:var(--fill)}
.pt.on span:last-child{font-weight:600}
.subs{display:flex;flex-wrap:wrap;gap:8px;padding:10px 6px 2px;border-top:.5px solid var(--sep);margin-top:8px}
.inline{display:flex;gap:8px;align-items:center;padding:8px 6px 0}
.inp{flex:1;min-width:0;height:40px;border-radius:10px;border:0;background:var(--fill);padding:0 12px;font-size:17px;outline:none}
.btn{height:40px;padding:0 16px;border-radius:10px;border:0;background:var(--blue);color:#fff;font-weight:600;font-size:15px;flex:none}
.btn.armed,.cell.armed{color:#fff;background:var(--red)}
.err{margin:0;padding:0 16px;color:var(--red);font-size:15px;font-weight:500}
.swatches{display:flex;flex-wrap:wrap;gap:10px;padding:12px 16px}
.sw{width:32px;height:32px;border-radius:50%;border:0;background:var(--c)}
.sw.on{box-shadow:0 0 0 3px var(--bg2),0 0 0 5px var(--c)}
.big-tile{display:flex;justify-content:center;padding-top:4px}
.big-tile .tile{width:72px;height:72px;border-radius:20px;font-size:38px}
.x{width:28px;height:28px;border-radius:50%;border:0;background:var(--fill);color:var(--label2);font-size:12px;font-weight:700;display:grid;place-items:center;flex:none;margin-left:auto}
textarea{width:100%;height:100px;border:0;border-radius:12px;background:var(--bg2);padding:10px 12px;font:12px/1.4 ui-monospace,Menlo,monospace;resize:vertical;color:var(--label)}

/* keypad */
.keypad{flex:none;background:var(--kbd);padding:8px max(6px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(6px,env(safe-area-inset-left,0px))}
.kgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;max-width:520px;margin:0 auto}
.key{height:46px;border:0;border-radius:9px;background:var(--key);color:var(--label);font-size:24px;box-shadow:0 1px 0 rgba(0,0,0,.3);font-variant-numeric:tabular-nums}
.key.op{background:var(--key2);font-size:22px}
.key:active{background:var(--key2)}
.key.op:active{background:var(--key)}
.key.done{grid-column:span 3;background:var(--blue);color:#fff;font-size:17px;font-weight:600}

/* lock */
.lock{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:env(safe-area-inset-top,0px) 16px env(safe-area-inset-bottom,0px)}
.lock-in{display:flex;flex-direction:column;align-items:center;gap:18px;width:100%;max-width:320px}
.lock-t{font-size:20px;font-weight:600;text-align:center}
.dots{display:flex;gap:20px}
.dots i{width:13px;height:13px;border-radius:50%;border:1.5px solid var(--label)}
.dots i.f{background:var(--label)}
.dots.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-10px)}40%,80%{transform:translateX(10px)}}
.lock-msg{min-height:20px;font-size:15px;color:var(--red);text-align:center}
.pin{display:grid;grid-template-columns:repeat(3,78px);gap:16px 24px}
.pin button{width:78px;height:78px;border-radius:50%;border:0;background:var(--fill);font-size:32px;font-weight:400;color:var(--label)}
.pin button:active{background:var(--fill2)}
.pin .pin-del{background:none;font-size:17px}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--glass);-webkit-backdrop-filter:blur(24px) saturate(180%);backdrop-filter:blur(24px) saturate(180%);box-shadow:var(--shadow),inset 0 0 0 .5px var(--glass-edge);color:var(--label);border-radius:99px;padding:12px 18px;display:flex;gap:14px;align-items:center;font-size:15px;font-weight:600;max-width:calc(100% - 32px)}
.toast button{border:0;background:none;color:var(--blue);font-weight:700;padding:0;font-size:15px}
.banner{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--bg2);border-radius:22px;padding:12px 16px;font-size:15px;color:var(--label2)}
</style>
</head>
<body>

<header class="navbar" id="navbar"><div class="nav-in"><div></div><div class="nav-title" id="nav-title"></div><div class="nav-trail" id="nav-trail"></div></div></header>
<main class="app" id="app"></main>

<div class="tabwrap"><div class="tabin">
  <nav class="tabbar" aria-label="Sections">

    <button class="tab" data-act="tab" data-v="stats"><svg viewBox="0 0 28 28"><path d="M13 5.1A9 9 0 1 0 22.9 15H13z"/><path d="M16.5 3.6a8.5 8.5 0 0 1 7.9 7.9h-7.9z"/></svg>Stats</button>
    <button class="tab" data-act="tab" data-v="acc"><svg viewBox="0 0 28 28"><rect x="3.5" y="7" width="21" height="15" rx="3.5"/><path d="M3.5 12h21M8 17.5h5"/></svg>Accounts</button>
    <button class="tab" data-act="tab" data-v="set"><svg viewBox="0 0 28 28"><circle cx="14" cy="14" r="3.6"/><path d="M14 3.5v3M14 21.5v3M3.5 14h3M21.5 14h3M6.6 6.6l2.1 2.1M19.3 19.3l2.1 2.1M6.6 21.4l2.1-2.1M19.3 8.7l2.1-2.1"/></svg>Settings</button>
  </nav>

</div></div>

<div class="sheet" id="sheet" hidden><button class="scrim" data-act="sheet-close" aria-label="Close"></button><div class="panel" id="panel" role="dialog" aria-modal="true"></div></div>

<div class="toast" id="toast" hidden></div>

<script>
(()=>{"use strict";
const KEY='pocket-ledger-v1';
const $=s=>document.querySelector(s);
const COLORS=['#FF3B30','#FF9500','#FFCC00','#34C759','#00C7BE','#30B0C7','#32ADE6','#007AFF','#5856D6','#AF52DE','#FF2D55','#A2845E','#8E8E93'];
const GROUPS=[['cash','Cash'],['bank','Bank accounts'],['card','Credit cards'],['savings','Savings'],['rewards','Rewards & points'],['invest','Investments'],['loan','Loans'],['other','Other']];
const GICON={cash:'💵',bank:'🏦',card:'💳',savings:'🐷',rewards:'🎁',invest:'📈',loan:'📄',other:'🗂️'};
const GCOL={cash:'#34C759',bank:'#007AFF',card:'#FF9500',savings:'#FF2D55',rewards:'#AF52DE',invest:'#5856D6',loan:'#8E8E93',other:'#A2845E'};
const LIAB={card:1,loan:1};
const CURRENCIES=['USD','EUR','GBP','INR','CAD','AUD','JPY','SGD','AED','CHF','MXN','NZD','ZAR'];
const ICON={Groceries:'🛒',Dining:'🍽️',Transport:'🚆',Rent:'🏠',Utilities:'💡',Shopping:'🛍️',Health:'💊',Entertainment:'🎬',Travel:'✈️',Subscriptions:'🔁',Other:'📦',Salary:'💼','Side income':'💻',Refund:'↩️'};
const DEF_EXP=[['Food','🍔',1,['Groceries','Restaurants','Coffee','Delivery']],['Transport','🚆',7,['Gas','Transit','Parking','Rideshare','Tolls']],['Housing','🏠',8,['Rent','Maintenance','Furniture']],['Utilities','💡',2,['Electric','Internet','Phone','Water']],['Shopping','🛍️',10,['Clothes','Household','Electronics']],['Health','💊',0,['Pharmacy','Doctor','Fitness']],['Entertainment','🎬',9,['Movies','Events','Games']],['Travel','✈️',5,['Flights','Hotels','Activities']],['Subscriptions','🔁',4,['Streaming','Software','Memberships']],['Gifts','🎁',11,[]],['Education','📚',6,[]],['Other','📦',12,[]]];
const DEF_INC=[['Salary','💼',3,[]],['Card rewards','🎁',9,['Sign-up bonus','Cash back','Points','Referral bonus']],['Side income','💻',7,[]],['Refund','↩️',5,[]],['Interest','🏦',8,[]],['Other income','💵',12,[]]];
const chevR='<svg class="i chev" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg>';
const chevD='<svg class="i chev" viewBox="0 0 24 24"><path d="M5 9l7 7 7-7"/></svg>';
const icL='<svg class="i" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>';
const icR='<svg class="i" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg>';
const icSearch='<svg class="i" viewBox="0 0 24 24" style="width:18px;height:18px"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.2-4.2"/></svg>';

/* ---------- helpers ---------- */
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-5);
const pad=n=>String(n).padStart(2,'0');
const ds=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const pd=s=>{const a=s.split('-').map(Number);return new Date(a[0],a[1]-1,a[2])};
const today=()=>ds(new Date());
const dim=(y,m)=>new Date(y,m+1,0).getDate();
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sum=a=>a.reduce((s,t)=>s+t.amt,0);
const r2=n=>Math.round(n*100)/100;
const fdate=(s,o)=>pd(s).toLocaleDateString(undefined,o||{month:'short',day:'numeric',year:'numeric'});
function addPeriod(s,freq,anchor){
  const d=pd(s);
  if(freq==='weekly'){d.setDate(d.getDate()+7);return ds(d)}
  let y=d.getFullYear(),m=d.getMonth();
  if(freq==='monthly'){m++;if(m>11){m=0;y++}}else y++;
  return ds(new Date(y,m,Math.min(anchor,dim(y,m))));
}
function evalAmt(s){
  s=String(s).replace(/×/g,'*').replace(/÷/g,'/').replace(/−/g,'-').replace(/[,\s$₹€£¥]/g,'');
  if(!s||!/^[\d.+\-*/()]+$/.test(s))return NaN;
  let i=0;
  const num=()=>{if(s[i]==='('){i++;const v=expr();if(s[i++]!==')')throw 0;return v}if(s[i]==='-'){i++;return -num()}const m=/^(\d+\.?\d*|\.\d+)/.exec(s.slice(i));if(!m)throw 0;i+=m[0].length;return parseFloat(m[0])};
  const term=()=>{let v=num();while(s[i]==='*'||s[i]==='/'){const o=s[i++],r=num();v=o==='*'?v*r:v/r}return v};
  const expr=()=>{let v=term();while(s[i]==='+'||s[i]==='-'){const o=s[i++],r=term();v=o==='+'?v+r:v-r}return v};
  try{const v=expr();if(i!==s.length||!isFinite(v))return NaN;return r2(v)}catch(e){return NaN}
}

/* ---------- state ---------- */
const mkCat=(a,kind)=>({id:uid(),name:a[0],icon:a[1],color:COLORS[a[2]],kind,budget:0,subs:a[3].slice()});
function defaults(){
  return{v:6,learn:{},voice:{defAcc:null},currency:'USD',mstart:1,budget:0,
    cats:[...DEF_EXP.map(a=>mkCat(a,'exp')),...DEF_INC.map(a=>mkCat(a,'inc'))],
    accs:[{id:uid(),name:'Cash',group:'cash',open:0},{id:uid(),name:'Checking',group:'bank',open:0},{id:uid(),name:'Credit card',group:'card',open:0}],
    tx:[],rec:[],tpl:[],lock:{hash:null,after:0},sample:false,last:{}};
}
let S,storageOK=true;
function addSample(){
  S.accs=[['Cash','cash',120],['Checking','bank',2400],['Savings','savings',8000],['Card rewards','rewards',85],['Credit card','card',0]].map(a=>({id:uid(),name:a[0],group:a[1],open:a[2],sample:true}));
  const A=n=>S.accs.find(a=>a.name===n).id, C=n=>S.cats.find(c=>c.name===n).id;
  const push=(date,o)=>{if(date>today())return;S.tx.push(Object.assign({id:uid(),ts:Date.now(),type:'exp',sub:'',payee:'',note:'',tags:[],to:null,sample:true,date},o,{cat:o.cat?C(o.cat):null,acc:A(o.acc),to:o.to?A(o.to):null}))};
  const t=new Date();
  for(let k=0;k<5;k++){
    const b=new Date(t.getFullYear(),t.getMonth()-k,1),y=b.getFullYear(),m=b.getMonth(),f=[1,1.12,.94,1.06,.9][k];
    const on=day=>ds(new Date(y,m,Math.min(day,dim(y,m))));
    push(on(1),{type:'inc',cat:'Salary',amt:3400,acc:'Checking',payee:'Employer',note:'Paycheck'});
    push(on(15),{type:'inc',cat:'Salary',amt:3400,acc:'Checking',payee:'Employer',note:'Paycheck'});
    push(on(1),{cat:'Housing',sub:'Rent',amt:1850,acc:'Checking',payee:'Landlord',tags:['home']});
    push(on(2),{type:'xfer',amt:500,acc:'Checking',to:'Savings',note:'Monthly savings'});
    if(k>0){
      push(on(20),{type:'xfer',amt:r2(780*f),acc:'Checking',to:'Credit card',note:'Card payment'});
      push(on(21),{type:'inc',cat:'Card rewards',sub:'Cash back',amt:r2(14*f),acc:'Card rewards',payee:'Credit card',note:'Monthly cash back'});
      [[5,'Food','Groceries',212,'Credit card','Supermarket'],[19,'Food','Groceries',188,'Credit card','Supermarket'],[10,'Food','Restaurants',146,'Credit card','Restaurants'],[12,'Utilities','Electric',96,'Checking','Electric co.'],[17,'Shopping','Household',120,'Credit card','Home store'],[22,'Transport','Gas',90,'Credit card','Gas station'],[25,'Entertainment','Events',55,'Credit card','Concert hall'],[3,'Subscriptions','Streaming',15.49,'Credit card','Streaming service'],[8,'Food','Coffee',38,'Cash','Coffee shop']]
        .forEach(r=>push(on(r[0]),{cat:r[1],sub:r[2],amt:r2(r[3]*(r[1]==='Subscriptions'?1:f)),acc:r[4],payee:r[5]}));
    }
  }
  [[0,'Food','Groceries',86.42,'Credit card','Supermarket','Weekly groceries'],[1,'Food','Restaurants',23.5,'Credit card','Thai kitchen','Team lunch',['work']],[2,'Transport','Transit',45,'Checking','Transit','Train pass top-up'],[3,'Food','Coffee',5.25,'Cash','Coffee shop',''],[4,'Shopping','Clothes',62.99,'Credit card','Sports store','Running shoes'],[6,'Utilities','Electric',74.3,'Checking','Electric co.',''],[8,'Food','Coffee',4.75,'Cash','Coffee shop',''],[9,'Entertainment','Movies',28,'Credit card','Cinema','Movie night'],[11,'Health','Pharmacy',20,'Checking','Pharmacy','Copay']]
    .forEach(r=>{const d=new Date(t);d.setDate(d.getDate()-r[0]);push(ds(d),{cat:r[1],sub:r[2],amt:r[3],acc:r[4],payee:r[5],note:r[6],tags:r[7]||[]})});
  S.tpl=[{id:uid(),name:'Coffee',sample:true,data:{type:'exp',amt:5.25,cat:C('Food'),sub:'Coffee',acc:A('Cash'),to:null,payee:'Coffee shop',note:'',tags:[]}}];
  const bs=new Date(t.getFullYear(),t.getMonth(),t.getDate()-50),be=new Date(bs.getFullYear(),bs.getMonth(),bs.getDate()+90);
  S.accs.find(a=>a.group==='card').bonus={amt:750,spend:4000,start:ds(bs),end:ds(be),done:false,tx:null};
  S.sample=true;
}
function fill(o){const d=defaults();for(const k in d)if(o[k]===undefined)o[k]=d[k];o.cats.forEach(c=>{if(!c.subs)c.subs=[];if(!c.icon)c.icon=c.name.charAt(0).toUpperCase()});
  if((o.v||0)<3){if(!o.cats.some(c=>c.kind==='inc'&&/card rewards/i.test(c.name)))o.cats.splice((o.cats.findIndex(c=>c.kind==='inc')+1)||o.cats.length,0,mkCat(DEF_INC[1],'inc'));o.v=3}
  if(o.v<4){(o.accs||[]).forEach(a=>{if(LIAB[a.group]&&a.open>0)a.open=-a.open});o.v=4}
  if(o.v<5){const bonusTx=new Set((o.accs||[]).map(a=>a.bonus&&a.bonus.tx).filter(Boolean));
    (o.tx||[]).forEach(t=>{const c=o.cats.find(x=>x.id===t.cat),a=(o.accs||[]).find(x=>x.id===t.acc);
      if(t.type==='inc'&&c&&isRewardsCat(c)&&a&&a.group==='card'&&!bonusTx.has(t.id))t.acc=rewardsAcc(a,o).id});o.v=5}
  if(o.v<6){rebuildLearn(o);o.voice=o.voice||{};if(!o.voice.defAcc){const a=(o.accs||[]).find(x=>/amex|american express/i.test(x.name));o.voice.defAcc=a?a.id:null}o.v=6}
  return o}
function upgrade(o){
  if(o.v>=2)return fill(o);
  if(o.sample&&o.tx.every(t=>t.sample)){S=defaults();addSample();return S}
  const n=defaults();n.currency=o.currency||'USD';n.budget=o.budget||0;n.sample=!!o.sample;
  n.cats=o.cats.map(c=>Object.assign({},c,{icon:ICON[c.name]||c.name.charAt(0).toUpperCase(),subs:[],budget:c.budget||0}));
  const ms=(o.methods&&o.methods.length?o.methods:['Cash','Checking']);
  n.accs=ms.map(m=>({id:uid(),name:m,group:/cash/i.test(m)?'cash':(/credit|amex|visa|master/i.test(m)&&!/debit/i.test(m))?'card':'bank',open:0}));
  const by={};n.accs.forEach(a=>by[a.name]=a.id);
  const dflt=(n.accs.find(a=>a.group==='bank')||n.accs[0]).id;
  const conv=t=>({id:t.id||uid(),ts:t.ts||Date.now(),type:t.type,amt:t.amt,date:t.date,cat:t.cat,sub:'',acc:by[t.method]||dflt,to:null,payee:'',note:t.note||'',tags:t.tags||[],rec:t.rec,sample:t.sample});
  n.tx=o.tx.map(conv);
  n.rec=(o.rec||[]).map(r=>Object.assign(conv(r),{freq:r.freq,start:r.start,anchor:r.anchor,last:r.last}));
  n.v=2;return fill(n);
}
function load(){
  let o=null;try{const r=localStorage.getItem(KEY);if(r)o=JSON.parse(r)}catch(e){storageOK=false}
  if(o&&Array.isArray(o.tx)&&Array.isArray(o.cats))S=upgrade(o);else{S=defaults();addSample()}
  save();
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));storageOK=true}catch(e){storageOK=false}}
const isRewardsCat=c=>!!c&&c.kind==='inc'&&/card rewards/i.test(c.name);
function rewardsAcc(card,st){st=st||S;let r=st.accs.find(x=>x.group==='rewards'&&x.card===card.id);
  if(!r){r={id:uid(),name:card.name+' Rewards',group:'rewards',open:0,card:card.id};const i=st.accs.indexOf(card);st.accs.splice(i<0?st.accs.length:i+1,0,r)}return r}
const cat=id=>S.cats.find(c=>c.id===id)||{id:null,name:'Uncategorized',icon:'?',color:'#8E8E93',kind:'exp',subs:[]};
const acc=id=>S.accs.find(a=>a.id===id)||{name:'Unknown account',group:'other'};
const firstCat=k=>{const c=S.cats.find(x=>x.kind===k);return c?c.id:null};
function bal(id){
  const a=S.accs.find(x=>x.id===id);let b=a?(+a.open||0):0;
  for(const t of S.tx){
    if(t.type==='inc'&&t.acc===id)b+=t.amt;
    else if(t.type==='exp'&&t.acc===id)b-=t.amt;
    else if(t.type==='xfer'){if(t.acc===id)b-=t.amt;if(t.to===id)b+=t.amt}
  }
  return r2(b);
}
function runRec(){
  const t=today();let made=0;
  S.rec.forEach(r=>{
    let d=r.last?addPeriod(r.last,r.freq,r.anchor):r.start,g=0;
    while(d<=t&&g++<600){
      S.tx.push({id:uid(),ts:Date.now(),type:r.type,amt:r.amt,date:d,cat:r.cat,sub:r.sub||'',acc:r.acc,to:r.to||null,payee:r.payee||'',note:r.note||'',tags:(r.tags||[]).slice(),rec:r.id,sample:r.sample});
      r.last=d;made++;d=addPeriod(d,r.freq,r.anchor);
    }
  });
  return made;
}
const payees=()=>[...new Set(S.tx.slice().reverse().map(t=>t.payee).filter(Boolean))].slice(0,60);

/* ---------- money ---------- */
let fc={};
function fmt(o){const k=S.currency+JSON.stringify(o||{});if(!(k in fc)){try{fc[k]=new Intl.NumberFormat(undefined,Object.assign({style:'currency',currency:S.currency},o||{}))}catch(e){fc[k]=null}}return fc[k]}
const money=(n,o)=>{const f=fmt(o);return f?f.format(n):S.currency+' '+n.toFixed(2)};
const signed=t=>(t.type==='inc'?(t.amt<0?'−':'+'):(t.amt<0?'−':''))+money(Math.abs(t.amt));
const compact=n=>money(n,{notation:'compact',maximumFractionDigits:1});
const tiny=n=>{const f=fmt({notation:'compact',maximumFractionDigits:n>=1000?1:0,currencyDisplay:'narrowSymbol'});return f?f.format(n).replace(/[^\d.,KMBkmb]/g,''):String(Math.round(n))};
function symbol(){const f=fmt();if(!f)return S.currency;const p=f.formatToParts(0).find(x=>x.type==='currency');return p?p.value:S.currency}

/* ---------- periods ---------- */
const mst=()=>Math.min(28,Math.max(1,+S.mstart||1));
function period(unit,anchor){
  const a=pd(anchor);let s,e;
  if(unit==='week'){s=new Date(a.getFullYear(),a.getMonth(),a.getDate()-a.getDay());e=new Date(s.getFullYear(),s.getMonth(),s.getDate()+7)}
  else if(unit==='year'){s=new Date(a.getFullYear(),0,1);e=new Date(a.getFullYear()+1,0,1)}
  else{const d=mst();let m=a.getMonth();if(a.getDate()<d)m--;s=new Date(a.getFullYear(),m,d);e=new Date(a.getFullYear(),m+1,d)}
  return{unit,s:ds(s),e:ds(e),start:s,end:e};
}
function plabel(p){
  const last=new Date(p.end.getFullYear(),p.end.getMonth(),p.end.getDate()-1);
  if(p.unit==='year')return String(p.start.getFullYear());
  if(p.unit==='month'&&mst()===1)return p.start.toLocaleDateString(undefined,{month:'long',year:'numeric'});
  const o={month:'short',day:'numeric'};
  const yr=last.getFullYear()!==new Date().getFullYear()?', '+last.getFullYear():'';
  return p.start.toLocaleDateString(undefined,o)+' to '+(p.start.getMonth()===last.getMonth()?last.getDate():last.toLocaleDateString(undefined,o))+yr;
}
function shortLabel(p){
  if(p.unit==='year')return String(p.start.getFullYear());
  if(p.unit==='week')return p.start.toLocaleDateString(undefined,{month:'short',day:'numeric'});
  return p.start.toLocaleDateString(undefined,{month:'short'});
}
const inP=(t,p)=>t.date>=p.s&&t.date<p.e;
const ptx=p=>S.tx.filter(t=>inP(t,p));
const isNowP=p=>{const t=today();return t>=p.s&&t<p.e};
function lastPeriods(n){const out=[];let a=view.anchor;for(let i=0;i<n;i++){const p=period(view.unit,a);out.unshift(p);a=ds(new Date(p.start.getFullYear(),p.start.getMonth(),p.start.getDate()-1))}return out}
function daysIn(p){return Math.round((p.end-p.start)/864e5)}
function elapsed(p){const t=pd(today());if(t<p.start)return 1;if(t>=p.end)return daysIn(p);return Math.round((t-p.start)/864e5)+1}

/* ---------- view ---------- */
const view={tab:'tx',unit:'month',anchor:today(),mode:'daily',q:'',filt:null,stat:'exp',open:null,calDay:null};
function shift(n){
  const p=period(view.unit,view.anchor);let d;
  if(view.unit==='week')d=new Date(p.start.getFullYear(),p.start.getMonth(),p.start.getDate()+7*n);
  else if(view.unit==='year')d=new Date(p.start.getFullYear()+n,0,1);
  else d=new Date(p.start.getFullYear(),p.start.getMonth()+n,p.start.getDate());
  view.anchor=ds(d);view.calDay=null;
}
const TITLES={tx:'Transactions',stats:'Stats',acc:'Accounts',set:'Settings'};
function render(){
  $('#nav-title').textContent=TITLES[view.tab];
  $('#nav-trail').innerHTML=view.tab==='acc'?'<button class="navicon" data-act="acc-new" aria-label="Add account"><svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>':'';
  const v=view.tab;
  $('#app').innerHTML=`<h1 class="large">${TITLES[v]}</h1>`+(v==='tx'?txTab():v==='stats'?statsTab():v==='acc'?accTab():setTab());
  document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('on',b.dataset.v===v));
}
function periodBar(){
  const p=period(view.unit,view.anchor);
  return `<div class="stack"><div class="pbar"><button class="pbtn" data-act="prev" aria-label="Previous">${icL}</button><button class="plabel" data-act="now" title="Jump to today">${esc(plabel(p))}</button><button class="pbtn" data-act="next" aria-label="Next">${icR}</button></div>
  <div class="seg">${[['week','Week'],['month','Month'],['year','Year']].map(u=>`<button data-act="unit" data-v="${u[0]}" class="${view.unit===u[0]?'on':''}">${u[1]}</button>`).join('')}</div></div>`;
}
function sum3(items){
  const inc=sum(items.filter(t=>t.type==='inc')),ex=sum(items.filter(t=>t.type==='exp')),net=inc-ex;
  return `<div class="group sum3"><div><span>Income</span><b class="inc">${money(inc)}</b></div><div><span>Expenses</span><b class="exp">${money(ex)}</b></div><div><span>Total</span><b>${net<0?'−':''}${money(Math.abs(net))}</b></div></div>`;
}
function banners(){
  let h='';
  if(S.sample)h+='<div class="banner"><span>These are sample entries so you can explore.</span><button class="btn" data-act="clear-sample">Clear samples</button></div>';
  if(!storageOK)h+='<div class="banner"><span>This view cannot save to your device. Install from your own link (Settings) to keep your data.</span></div>';
  return h;
}

/* ---------- transactions tab ---------- */
function txTab(){
  const p=period(view.unit,view.anchor);
  let items=ptx(p);
  const f=view.filt;
  if(f)items=items.filter(t=>f.k==='acc'?(t.acc===f.id||t.to===f.id):t.cat===f.id);
  const q=view.q.trim().toLowerCase();
  let h=banners()+periodBar()+sum3(items);
  h+=`<div class="search">${icSearch}<input id="q" type="search" placeholder="Search all transactions" value="${esc(view.q)}" autocomplete="off" enterkeyhint="search"></div>`;
  if(f)h+=`<div class="pill">${f.k==='acc'?esc(acc(f.id).name):esc(cat(f.id).name)}<button data-act="clear-filt" aria-label="Clear filter">✕</button></div>`;
  if(!q)h+=`<div class="seg">${[['daily','List'],['cal','Calendar']].map(m=>`<button data-act="mode" data-v="${m[0]}" class="${view.mode===m[0]?'on':''}">${m[1]}</button>`).join('')}</div>`;
  h+=`<div id="list">${q?searchHTML():view.mode==='cal'?calHTML(items):view.unit==='year'?yearHTML(items):listHTML(items)}</div>`;
  return `<div class="stack">${h}</div>`;
}
function searchHTML(){
  const q=view.q.trim().toLowerCase();
  const items=S.tx.filter(t=>{const c=t.cat?cat(t.cat).name:'';return [t.note,t.payee,c,t.sub,acc(t.acc).name,t.to?acc(t.to).name:'',(t.tags||[]).join(' '),t.amt.toFixed(2)].join(' ').toLowerCase().includes(q)});
  if(!items.length)return '<div class="empty"><b>No results</b>Try a payee, note, tag, category or amount.</div>';
  return `<div class="sec-h" style="padding-top:8px"><span>${items.length} result${items.length===1?'':'s'}</span><span class="num">${money(sum(items.filter(t=>t.type==='exp')))} spent</span></div>`+listHTML(items,true);
}
function listHTML(items,flat){
  if(!items.length)return '<div class="empty"><b>No transactions</b>Tap + to add one for this period.</div>';
  items=items.slice().sort((a,b)=>a.date<b.date?1:a.date>b.date?-1:(b.ts||0)-(a.ts||0));
  const order=[],map={};
  items.forEach(t=>{if(!map[t.date]){map[t.date]=[];order.push(t.date)}map[t.date].push(t)});
  return order.map((d,i)=>{
    const it=map[d],ex=sum(it.filter(t=>t.type==='exp')),inc=sum(it.filter(t=>t.type==='inc'));
    let lab=fdate(d,{weekday:'short',month:'short',day:'numeric'});if(d===today())lab='Today';
    if(flat)lab=fdate(d,{weekday:'short',month:'short',day:'numeric',year:'numeric'});
    const r=[inc?`<span class="inc">+${money(inc)}</span>`:'',ex?money(ex):''].filter(Boolean).join(' · ');
    return `<div class="day-h"${i===0?' style="padding-top:6px"':''}><span>${esc(lab)}</span><span class="num">${r}</span></div><div class="group">${it.map(rowHTML).join('')}</div>`;
  }).join('');
}
function rowHTML(t){
  let tile,title,sub,amt;
  if(t.type==='xfer'){
    tile=`<span class="tile lg" style="--c:#8E8E93">⇄</span>`;
    title=t.note||'Transfer';sub=acc(t.acc).name+' → '+acc(t.to).name;
    amt=`<span class="row-a xf">${money(t.amt)}</span>`;
  }else{
    const c=cat(t.cat);tile=`<span class="tile lg" style="--c:${c.color}">${esc(c.icon)}</span>`;
    title=t.note||t.payee||t.sub||c.name;
    const bits=[c.name+(t.sub?' · '+t.sub:'')];if(t.note&&t.payee)bits.push(t.payee);
    sub=bits.join(' · ');
    amt=`<span class="row-a ${t.type==='inc'?'inc':''}">${signed(t)}<small>${esc(acc(t.acc).name)}</small></span>`;
  }
  const tags=(t.tags||[]).map(g=>`<span class="tag">${esc(g)}</span>`).join('');
  return `<div class="swipe"><button class="del" data-act="row-del" data-id="${t.id}">Delete</button><button class="row" data-act="edit" data-id="${t.id}">${tile}<span class="row-m"><span class="row-t" style="display:block">${esc(title)}${t.rec?' <span class="tag">Repeats</span>':''}</span><span class="row-s" style="display:block">${esc(sub)}${tags}</span></span>${amt}</button></div>`;
}
function calHTML(items){
  if(view.unit!=='month'){view.unit='month'}
  const p=period('month',view.anchor),agg={};
  items.forEach(t=>{const a=agg[t.date]||(agg[t.date]={i:0,e:0});if(t.type==='inc')a.i+=t.amt;else if(t.type==='exp')a.e+=t.amt});
  const days=[];for(let d=new Date(p.start);d<p.end;d=new Date(d.getFullYear(),d.getMonth(),d.getDate()+1))days.push(ds(d));
  if(!view.calDay||!days.includes(view.calDay))view.calDay=isNowP(p)?today():days[0];
  const wd=[];for(let i=0;i<7;i++)wd.push(new Date(2026,1,1+i).toLocaleDateString(undefined,{weekday:'narrow'}));
  let cells='';for(let i=0;i<p.start.getDay();i++)cells+='<span></span>';
  days.forEach(d=>{const a=agg[d],n=pd(d).getDate();cells+=`<button class="cd${d===today()?' today':''}${d===view.calDay?' on':''}" data-act="calday" data-v="${d}" aria-label="${esc(fdate(d))}"><span class="n">${n}</span>${a&&a.i?`<i class="ci">${tiny(a.i)}</i>`:''}${a&&a.e?`<i class="ce">${tiny(a.e)}</i>`:''}</button>`});
  const dayItems=items.filter(t=>t.date===view.calDay);
  return `<div class="group"><div class="calw">${wd.map(w=>`<span>${esc(w)}</span>`).join('')}</div><div class="cal">${cells}</div></div>`+
    (dayItems.length?listHTML(dayItems):`<div class="sec-h"><span>${esc(fdate(view.calDay,{weekday:'long',month:'short',day:'numeric'}))}</span></div><div class="empty">Nothing on this day. Tap + to add an entry for it.</div>`);
}
function yearHTML(items){
  const y=period('year',view.anchor).start.getFullYear();let rows='';
  for(let m=11;m>=0;m--){
    const k=y+'-'+pad(m+1),it=items.filter(t=>t.date.slice(0,7)===k);if(!it.length)continue;
    const inc=sum(it.filter(t=>t.type==='inc')),ex=sum(it.filter(t=>t.type==='exp'));
    rows+=`<button class="cell ic" data-act="open-month" data-v="${k}-01"><span class="tile solid" style="--c:var(--blue)">${new Date(y,m,1).toLocaleDateString(undefined,{month:'short'}).slice(0,3)}</span><span class="grow">${new Date(y,m,1).toLocaleDateString(undefined,{month:'long'})}<span class="sub"><span class="inc">+${money(inc)}</span> · <span class="exp">${money(ex)}</span></span></span><span class="val num">${inc-ex<0?'−':''}${money(Math.abs(inc-ex))}</span>${chevR}</button>`;
  }
  return rows?`<div class="group">${rows}</div><p class="sec-f">Calendar months. Tap one to see its entries.</p>`:'<div class="empty"><b>No transactions</b>Nothing logged in '+y+' yet.</div>';
}

/* ---------- stats tab ---------- */
function statsTab(){
  const p=period(view.unit,view.anchor),k=view.stat;
  let h=periodBar()+`<div class="seg">${[['exp','Spending'],['inc','Income'],['budget','Budget']].map(s=>`<button data-act="stat" data-v="${s[0]}" class="${k===s[0]?'on':''}">${s[1]}</button>`).join('')}</div>`;
  if(k==='budget')return `<div class="stack">${h}${budgetHTML(p)}</div>`;
  const tx=ptx(p).filter(t=>t.type===k),total=sum(tx);
  if(!tx.length)return `<div class="stack">${h}<div class="empty"><b>No ${k==='exp'?'spending':'income'} yet</b>Charts fill in as you log entries.</div>${trendHTML(k)}</div>`;
  const by={};tx.forEach(t=>{const r=by[t.cat]||(by[t.cat]={id:t.cat,v:0,n:0,subs:{},tx:[]});r.v+=t.amt;r.n++;const sk=t.sub||'';r.subs[sk]=(r.subs[sk]||0)+t.amt});
  const arr=Object.values(by).filter(r=>r.v>0).sort((a,b)=>b.v-a.v),pos=arr.reduce((s,r)=>s+r.v,0);
  if(!arr.length)return `<div class="stack">${h}<div class="empty"><b>Nothing to chart</b>Refunds cancel out everything in this period.</div></div>`;
  h+=`<div class="group" style="padding:10px 0 6px">${donut(arr,pos,k,total)}</div>`;
  h+=`<div class="group">`+arr.map(r=>{
    const c=cat(r.id),open=view.open===r.id;
    let x=`<button class="cell ic" data-act="stat-open" data-id="${r.id}"><span class="tile" style="--c:${c.color}">${esc(c.icon)}</span><span class="grow">${esc(c.name)}<span class="sub">${r.n} ${r.n===1?'entry':'entries'}</span></span><span class="pct">${Math.round(r.v/pos*100)}%</span><span class="val num" style="margin-left:8px;color:var(--label)">${money(r.v)}</span>${open?chevD:chevR}</button>`;
    if(open){
      const subs=Object.entries(r.subs).sort((a,b)=>b[1]-a[1]),mx=subs[0][1];
      x+=subs.map(s=>`<div class="subrow"><div class="t"><span>${esc(s[0]||'No subcategory')}</span><span>${money(s[1])}</span></div><div class="bar"><i style="width:${Math.max(0,s[1]/mx*100).toFixed(1)}%;background:${c.color}"></i></div></div>`).join('');
      x+=`<button class="cell link" data-act="filt-cat" data-id="${r.id}" style="padding-left:62px">Show ${esc(c.name)} entries</button>`;
    }
    return x;
  }).join('')+`</div>`;
  const pay={};tx.forEach(t=>{if(t.payee)pay[t.payee]=(pay[t.payee]||0)+t.amt});
  const top=Object.entries(pay).sort((a,b)=>b[1]-a[1]).slice(0,5);
  if(top.length)h+=`<div><div class="sec-h"><span>${k==='exp'?'Top payees':'Top sources'}</span></div><div class="group">${top.map(e=>`<div class="cell"><span class="grow">${esc(e[0])}</span><span class="val num">${money(e[1])}</span></div>`).join('')}</div></div>`;
  h+=trendHTML(k);
  const big=tx.reduce((a,b)=>b.amt>a.amt?b:a);
  h+=`<div class="group stats"><div><span>Average per day</span><b>${money(total/elapsed(p))}</b></div><div><span>Entries</span><b>${tx.length}</b></div><div><span>Largest</span><b>${money(big.amt)}</b><small>${esc(big.note||big.payee||cat(big.cat).name)}</small></div><div><span>Categories</span><b>${arr.length}</b></div></div>`;
  return `<div class="stack">${h}</div>`;
}
function donut(arr,total,k,shown){
  const R=68,C=2*Math.PI*R;let off=0,segs='';
  arr.forEach(r=>{const len=r.v/total*C,gap=arr.length>1?Math.min(2.5,len*.4):0;
    segs+=`<circle r="${R}" cx="90" cy="90" fill="none" stroke="${cat(r.id).color}" stroke-width="24" stroke-dasharray="${Math.max(0,len-gap).toFixed(2)} ${(C-len+gap).toFixed(2)}" stroke-dashoffset="${(-off).toFixed(2)}" transform="rotate(-90 90 90)"/>`;off+=len});
  return `<svg class="donut" viewBox="0 0 180 180" role="img" aria-label="${k==='exp'?'Spending':'Income'} by category"><circle r="${R}" cx="90" cy="90" fill="none" style="stroke:var(--fill)" stroke-width="24"/>${segs}<text x="90" y="84" text-anchor="middle" class="d1">${k==='exp'?'Spent':'Earned'}</text><text x="90" y="108" text-anchor="middle" class="d2">${esc((shown<0?'−':'')+compact(Math.abs(shown==null?total:shown)))}</text></svg>`;
}
function trendHTML(k){
  const ps=lastPeriods(6),vals=ps.map(p=>sum(ptx(p).filter(t=>t.type===k))),mx=Math.max(...vals)||1;
  return `<div><div class="sec-h"><span>Last 6 ${view.unit}s</span></div><div class="group trend">${ps.map((p,i)=>`<div class="tc${i===5?' on':''}"><span class="tv">${vals[i]?esc(compact(vals[i])):''}</span><div class="tb"><i style="height:${(vals[i]/mx*100).toFixed(1)}%"></i></div><span class="tl">${esc(shortLabel(p))}</span></div>`).join('')}</div></div>`;
}
function budgetHTML(p){
  const f=p.unit==='week'?12/52:p.unit==='year'?12:1,ex=ptx(p).filter(t=>t.type==='exp'),spent=sum(ex),by={};
  ex.forEach(t=>by[t.cat]=(by[t.cat]||0)+t.amt);
  const mark=isNowP(p)?`<b style="left:${(elapsed(p)/daysIn(p)*100).toFixed(1)}%" title="Today"></b>`:'';
  const meter=(sp,b)=>{const pc=sp/b;return `<div class="meter${pc>1?' over':pc>.85?' warn':''}"><i style="width:${Math.min(100,pc*100).toFixed(1)}%"></i>${mark}</div>`};
  let h='';
  const tb=S.budget*f;
  h+=`<div class="group"><label class="cell"><span class="grow">Monthly budget</span><input class="binp" inputmode="decimal" data-bud="total" value="${S.budget||''}" placeholder="None"></label>`;
  if(S.budget){const left=tb-spent;h+=`<div class="cell" style="display:block"><div style="display:flex;justify-content:space-between;font-size:15px"><span>${money(spent)} spent</span><span class="${left<0?'red':''}">${left>=0?money(left)+' left':money(-left)+' over'}</span></div>${meter(spent,tb)}${isNowP(p)&&left>0?`<span class="sub" style="margin-top:8px">About ${money(left/(daysIn(p)-elapsed(p)+1))} a day for the rest of this ${p.unit}</span>`:''}</div>`}
  h+=`</div><div class="sec-h"><span>By category</span><span class="num">${p.unit==='month'?'':'Scaled to this '+p.unit}</span></div><div class="group">`;
  h+=S.cats.filter(c=>c.kind==='exp').map(c=>{const sp=by[c.id]||0,b=(c.budget||0)*f;
    return `<div class="cell ic" style="flex-wrap:wrap"><span class="tile" style="--c:${c.color}">${esc(c.icon)}</span><span class="grow">${esc(c.name)}<span class="sub">${money(sp)}${b?' of '+money(b):' spent'}</span></span><input class="binp" inputmode="decimal" data-bud="${c.id}" value="${c.budget||''}" placeholder="No limit" aria-label="${esc(c.name)} monthly budget">${b?`<div style="flex-basis:100%;padding-left:42px">${meter(sp,b)}</div>`:''}</div>`}).join('');
  h+=`</div><p class="sec-f">Enter monthly amounts. Week and year views scale them automatically. The thin line marks today.</p>`;
  return h;
}

/* ---------- accounts tab ---------- */
function accTab(){
  let assets=0,liab=0;S.accs.forEach(a=>{const b=bal(a.id);if(b<0)liab+=b;else assets+=b});
  let h=banners()+`<div class="group"><div class="hero"><span>Net worth</span><b class="${assets+liab<0?'red':''}">${assets+liab<0?'−':''}${money(Math.abs(assets+liab))}</b></div><div class="sum3" style="border-top:.5px solid var(--sep);grid-template-columns:1fr 1fr"><div><span>Assets</span><b class="inc">${money(assets)}</b></div><div><span>Liabilities</span><b class="exp">${money(Math.abs(liab))}</b></div></div></div>`;
  const act=S.accs.filter(a=>a.group==='card'&&a.bonus&&!a.bonus.done);
  if(act.length)h+=`<div><div class="sec-h"><span>Sign-up bonuses</span><span class="num">${money(act.reduce((s,a)=>s+a.bonus.amt,0))} in progress</span></div><div class="group">${act.map(bonusRow).join('')}</div></div>`;
  GROUPS.forEach(g=>{
    const list=S.accs.filter(a=>a.group===g[0]);if(!list.length)return;
    const tot=list.reduce((s,a)=>s+bal(a.id),0);
    h+=`<div><div class="sec-h"><span>${g[1]}</span><span class="num">${tot<0?'−':''}${money(Math.abs(tot))}</span></div><div class="group">${list.map(a=>{const b=bal(a.id);return `<button class="cell ic" data-act="acc-edit" data-id="${a.id}"><span class="tile" style="--c:${GCOL[a.group]}">${GICON[a.group]}</span><span class="grow">${esc(a.name)}${(()=>{const r=a.group==='card'&&S.accs.find(x=>x.group==='rewards'&&x.card===a.id),rb=r?bal(r.id):0,st=LIAB[a.group]&&b<0?'Owed':LIAB[a.group]&&b>0?'Credit balance':'';const t=[st,rb?'Rewards '+money(rb):''].filter(Boolean).join(' · ');return t?`<span class="sub">${esc(t)}</span>`:''})()}</span><span class="val num" style="color:${b<0?'var(--red)':'var(--label)'}">${b<0?'−':''}${money(Math.abs(b))}</span>${chevR}</button>`}).join('')}</div></div>`;
  });
  h+=`<div class="group"><button class="cell link" data-act="acc-new">Add Account</button><button class="cell link" data-act="xfer">New Transfer</button></div><p class="sec-f">Balances start from each account's starting balance plus everything logged. Transfers move money between accounts and never count as spending. Add a sign-up bonus to any credit card to track its minimum spend; once earned it is added to your assets.</p>`;
  return `<div class="stack">${h}</div>`;
}

const amtShown=()=>sh.d.amt||'0';
function amtExpr(){const a=sh.d.amt||'',v=evalAmt(a);if(isNaN(v))return a==='−'?(sh.type==='exp'?'Negative expense = refund':'Negative amount'):'';let x='';if(/[÷×−+]/.test(a.replace(/^−/,'')))x='= '+(v<0?'−':'')+money(Math.abs(v));if(v<0&&sh.type!=='xfer')x+=(x?' · ':'')+(sh.type==='exp'?'Refund, lowers spending':'Lowers income');return x}

    if(sh.pick)rows+=picker(ty,d);

  const favs=edit?[]:S.tpl.filter(f=>f.data.type===ty);

  <div class="seg">${['exp','inc','xfer'].map(k=>`<button data-act="tx-type" data-v="${k}" class="${ty===k?'on':''}">${NAMES[k]}</button>`).join('')}</div>

  <button class="amount ${ty}${sh.kp?' typing':''}" data-act="kp-open" id="amt" aria-label="Amount"><span class="cur">${esc(symbol())}</span><span id="amt-v">${esc(amtShown())}</span></button>

function picker(ty,d){

  return `<div class="picker"><div class="pgrid">${cats.map(x=>`<button class="pt${x.id===d.cat?' on':''}" data-act="pick-cat" data-id="${x.id}"><span class="tile" style="--c:${x.color}">${esc(x.icon)}</span><span>${esc(x.name)}</span></button>`).join('')}<button class="pt" data-act="pick-new"><span class="tile" style="--c:#8E8E93">+</span><span>New</span></button></div>
  <div class="inline" id="pick-new" hidden><input class="inp" id="f-newcat" placeholder="Category name"><button class="btn" data-act="pick-new-save">Add</button></div>
  ${c&&c.subs.length?`<div class="subs"><button class="chip${!d.sub?' on':''}" data-act="pick-sub" data-v="">${esc(c.name)} only</button>${c.subs.map(s=>`<button class="chip${d.sub===s?' on':''}" data-act="pick-sub" data-v="${esc(s)}">${esc(s)}</button>`).join('')}</div>`:''}</div>`;
}
function capture(){
  if(!sh)return;const g=id=>{const e=$('#'+id);return e?e.value:null};
  if(sh.kind==='tx'){[['date','f-date'],['acc','f-acc'],['to','f-to'],['payee','f-payee'],['note','f-note'],['tags','f-tags'],['repeat','f-repeat']].forEach(p=>{const v=g(p[1]);if(v!==null)sh.d[p[0]]=v})}
  else if(sh.kind==='acc'){['name','group','open','bamt','bspend','bstart','bend','bdep'].forEach(k=>{const v=g('a-'+k);if(v!==null)sh.d[k]=v})}
  else{['name','icon','budget'].forEach(k=>{const v=g('c-'+k);if(v!==null)sh.d[k]=v})}
}
function kp(k){
  let a=sh.d.amt||'';const seg=a.split(/[÷×−+]/).pop();
  if(k==='done'){const v=evalAmt(a);if(!isNaN(v)&&/[÷×−+]/.test(a))a=(v<0?'−':'')+Math.abs(v);sh.d.amt=a;sh.kp=false;$('#kp').hidden=true;$('#amt').classList.remove('typing');updAmt();return}
  if(k==='C')a='';
  else if(k==='⌫')a=a.slice(0,-1);
  else if(/[÷×−+]/.test(k)){if(!a){if(k!=='−')return;sh.d.amt='−';updAmt();return}if(a==='−')return;if(/[÷×−+.]$/.test(a))a=a.slice(0,-1);a+=k}
  else if(k==='.'){if(seg.includes('.'))return;a+=seg?'.':'0.'}
  else{if(/\.\d\d$/.test(seg)||a.length>20)return;if(seg==='0')a=a.slice(0,-1);a+=k}
  sh.d.amt=a;updAmt();
}
function updAmt(){$('#amt-v').textContent=amtShown();$('#amt-x').textContent=amtExpr()}
function showKp(){if(!sh||sh.kind!=='tx')return;sh.kp=true;$('#kp').hidden=false;$('#amt').classList.add('typing');if(document.activeElement&&document.activeElement.blur)document.activeElement.blur()}
function hideKp(){if(!sh||!sh.kp)return;sh.kp=false;const k=$('#kp');if(k)k.hidden=true;const a=$('#amt');if(a)a.classList.remove('typing')}
function err(m){const e=$('#f-err');e.textContent=m;e.hidden=false;e.scrollIntoView({block:'nearest',behavior:'smooth'})}
function txData(){
  capture();const d=sh.d,ty=sh.type,amt=evalAmt(d.amt);
  if(isNaN(amt)||amt===0)return err('Enter an amount.');if(ty==='xfer'&&amt<0)return err('Transfers need a positive amount. Swap From and To instead.');
  if(!/^\d{4}-\d{2}-\d{2}$/.test(d.date))return err('Pick a date.');
  if(!d.acc||!S.accs.some(a=>a.id===d.acc))return err('Add an account first in the Accounts tab.');
  if(ty==='xfer'){if(!d.to)return err('Choose the account the money goes to.');if(d.to===d.acc)return err('From and To need to be different accounts.')}
  else if(!d.cat||!S.cats.some(c=>c.id===d.cat&&c.kind===ty))return err('Choose a category.');
  return{type:ty,amt,date:d.date,cat:ty==='xfer'?null:d.cat,sub:ty==='xfer'?'':d.sub,acc:d.acc,to:ty==='xfer'?d.to:null,payee:ty==='xfer'?'':d.payee.trim(),note:d.note.trim(),tags:d.tags.split(',').map(s=>s.trim()).filter(Boolean)};
}
function saveTx(more){
  const data=txData();if(!data)return;const d=sh.d,ty=sh.type;
  if(ty!=='xfer')S.last['c_'+ty]=d.cat;S.last.acc=d.acc;if(ty==='xfer')S.last.to=d.to;
  let msg='Saved';
  learnFrom(data);if(ty==='inc')S.last.incAcc=d.acc;if(ty==='xfer')S.last.xferFrom=d.acc;
  const da=S.accs.find(x=>x.id===data.acc);
  if(data.type==='inc'&&isRewardsCat(cat(data.cat))&&da&&da.group==='card'){data.acc=rewardsAcc(da).id;msg='Saved to '+acc(data.acc).name}
  if(sh.id){const t=S.tx.find(x=>x.id===sh.id);Object.assign(t,data);delete t.sample}
  else if(d.repeat&&d.repeat!=='none'){
    S.rec.push(Object.assign({},data,{id:uid(),freq:d.repeat,start:d.date,anchor:pd(d.date).getDate(),last:null}));
    const n=runRec();msg=n>1?`Saved, with ${n-1} earlier repeat${n>2?'s':''} added`:n?'Saved as repeating':'Repeat starts '+fdate(d.date);
  }else S.tx.push(Object.assign({id:uid(),ts:Date.now()},data));
  save();
  if(sh.ret&&sh.retIdx!=null){const r=sh.ret;r.items[sh.retIdx].saved=true;sh=r;drawSheet();render();toast(msg);return}
  if(more){const keep={date:d.date,acc:d.acc,to:d.to};closeSheet();render();newTx(ty,keep);toast(msg);return}
  if(!inP(data,period(view.unit,view.anchor)))view.anchor=data.date;
  if(view.mode==='cal')view.calDay=data.date;
  closeSheet();render();toast(msg);
}

function openAcc(id,group){
  const a=id&&S.accs.find(x=>x.id===id),b=a&&a.bonus,t=new Date();
  sh={kind:'acc',id:a?a.id:null,d:{name:a?a.name:'',group:a?a.group:(group||'bank'),open:a&&a.open?String(LIAB[a.group]?-a.open:a.open):'',
    bamt:b?String(b.amt):'',bspend:b&&b.spend?String(b.spend):'',bstart:b?b.start:today(),bend:b?b.end:ds(new Date(t.getFullYear(),t.getMonth()+3,t.getDate())),bdep:''}};openPanel();
}
function saveAcc(){
  const d=sh.d;if(!d.name.trim())return err('Give the account a name.');
  let o=d.open.trim()?evalAmt(d.open):0;if(isNaN(o))return err('Balance should be a number, like 1200.');
  if(LIAB[d.group])o=-o;
  let a=sh.id&&S.accs.find(x=>x.id===sh.id),bonus;
  const keepDone=a&&a.bonus&&a.bonus.done;
  if(d.group==='card'&&!keepDone){
    const ba=d.bamt.trim()?evalAmt(d.bamt):0,bs=d.bspend.trim()?evalAmt(d.bspend):0;
    if(isNaN(ba)||ba<0)return err('Bonus value should be a number, like 750.');
    if(ba>0){
      if(isNaN(bs)||bs<0)return err('Spend needed should be a number, like 4000.');
      if(!d.bstart||!d.bend||d.bend<d.bstart)return err('The bonus deadline needs to be after its start date.');
      bonus=Object.assign({},(a&&a.bonus)||{done:false,tx:null},{amt:ba,spend:bs,start:d.bstart,end:d.bend});
    }
  }

function wordsToNums(t){
  const W=Object.keys(NW).join('|');
  const re=new RegExp('\\b((?:(?:'+W+'|hundred|thousand|a|and|point)\\b\\s?)+)','g');
  return t.replace(re,m=>{

    if(!toks.some(w=>(w in NW&&w!=='one'&&w!=='zero')||w==='hundred'||w==='thousand'))return m;
    while(toks.length&&(toks[0]==='and'||toks[0]==='a'&&!['hundred','thousand'].includes(toks[1])))toks.shift();
    while(toks.length&&(toks[toks.length-1]==='and'||toks[toks.length-1]==='a'))toks.pop();
    if(!toks.length)return m;
    const chunks=[];let cur=null,last=null;
    const flush=()=>{if(cur)chunks.push(cur.total+cur.part);cur=null};
    let dec=null;
    for(const w of toks){
      if(w==='point'){flush();dec='';continue}
      if(dec!==null){if(w in NW)dec+=String(NW[w]);continue}
      if(w==='and')continue;
      if(!cur)cur={total:0,part:0};
      if(w==='a'){cur.part=1;continue}
      if(w==='hundred'){cur.part=(cur.part||1)*100;last=w;continue}
      if(w==='thousand'){cur.total+=(cur.part||1)*1000;cur.part=0;last=w;continue}

function splitClauses(t){
  const ams=findAmounts(canon(t)).length>1?findAmounts(t):[];
  if(ams.length<2)return [t];
  const parts=[];let from=0;
  for(let i=1;i<ams.length;i++){
    const gap=t.slice(ams[i-1].end,ams[i].start);
    const re=/(?:^|\s)(and|also|plus|then|,|;)(?=\s|$)/g;let m,last=null;while((m=re.exec(gap)))last=m;
    const cutAt=last?ams[i-1].end+last.index:ams[i].start;
    const nextStart=last?ams[i-1].end+last.index+last[0].length:ams[i].start;
    parts.push(t.slice(from,cutAt));from=nextStart;
  }
  parts.push(t.slice(from));
  return parts.map(p=>p.trim()).filter(Boolean);
}
function parseCommand(t){
  let m=/^(?:please |hey |ok |okay )?(delete|remove|erase|cancel)\b ?(.*)$/.exec(t);
  if(m)return{kind:'del',target:m[2]};
  m=/^(?:please |hey |ok |okay )?(change|edit|update|fix|correct|set|make)\b ?(.*?) (?:to|into|as) (.+)$/.exec(t);
  if(m)return{kind:'edit',target:m[2],to:m[3]};
  m=/^(?:please )?(change|edit|update|fix|correct)\b ?(.*)$/.exec(t);
  if(m)return{kind:'edit',target:m[2],to:''};
  return null;
}
const CMD_STOP=new Set('the a an my entry transaction transactions expense income one that this from on at for of purchase payment charge it i made spent was last latest recent previous most just thing'.split(' '));
function findMatches(target){
  let q=wordsToNums(target);const dd=extractDate(q);if(dd)q=dd.rest;
  q=canon(q);const am=findAmounts(q)[0];if(am)q=cut(q,am.start,am.end);
  const lastOnly=/\b(last|latest|recent|previous|most recent)\b/.test(target);
  const words=q.replace(/,/g,' ').split(' ').filter(w=>w&&!CMD_STOP.has(w));
  let list=S.tx.slice();
  if(dd)list=list.filter(t=>t.date===dd.date);
  if(am)list=list.filter(t=>Math.abs(t.amt)===Math.abs(am.v));
  const scored=list.map(t=>{
    const hay={p:canon(norm(t.payee)),n:canon(norm(t.note)),c:t.cat?norm(cat(t.cat).name+' '+(t.sub||'')):'transfer',a:canon(norm(acc(t.acc).name+' '+(t.to?acc(t.to).name:'')))};
    let s=0,hit=0;words.forEach(w=>{let x=0;if(hasW(hay.p,w)||hay.p.includes(w))x=3;else if(hasW(hay.n,w)||hay.n.includes(w))x=2.5;else if(hay.c.includes(w))x=1.5;else if(hay.a.includes(w))x=1;if(x){hit++;s+=x}});
    return{t,s,hit};
  }).filter(r=>!words.length||r.hit>0);
  scored.sort((a,b)=>b.hit-a.hit||b.s-a.s||(b.t.date>a.t.date?1:b.t.date<a.t.date?-1:0)||(b.t.ts||0)-(a.t.ts||0));
  if(!words.length&&!dd&&!am&&lastOnly){scored.sort((a,b)=>(b.t.ts||0)-(a.t.ts||0))}
  if(!words.length&&!dd&&!am&&!lastOnly)return [];
  return scored.slice(0,!words.length&&lastOnly?1:3).map(r=>r.t);
}
function parseChange(v,t){

  const h=findAccounts(q)[0];if(h&&h.acc.id!==t.acc){ch.acc=h.acc.id;q=cut(q,h.start,h.end)}

function parseVoice(text){

    return{cmd:Object.assign(cmd,{ids:matches.map(m=>m.id),changes:matches.map(m=>cmd.kind==='edit'?parseChange(cmd.to,m):{})})};
  }
  const items=splitClauses(t).map(parseClause);

  const dates=[...new Set(items.filter(i=>i.dateX).map(i=>i.date))];

    if(!i.accX&&i.type==='exp'&&accs.length===1){i.acc=accs[0];i.miss=i.miss.filter(x=>x!=='acc')}
    if(!i.dateX)i.date=dates.length===1?dates[0]:today();
